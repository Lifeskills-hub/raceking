<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Race King</title>
<meta name="theme-color" content="#0b1020">
<style>
:root{--bg:#090d19;--panel:#151c31;--panel2:#1d2742;--line:#303b61;--gold:#ffcf38;--orange:#ff8426;--blue:#57baff;--green:#4de190;--red:#ff6178;--text:#f8f9ff;--muted:#aeb6d1;--shadow:0 18px 55px #0007}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#293a70,#11172b 38%,var(--bg) 75%);color:var(--text)}body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}.app{width:min(100%,520px);padding:18px 15px 40px}.hidden{display:none!important}.brand{text-align:center;margin:10px 0 17px}.crown{font-size:48px;filter:drop-shadow(0 8px 18px #ffb82e55);animation:float 2.4s ease-in-out infinite}.brand h1{font-size:clamp(38px,12vw,60px);line-height:.92;margin:5px 0 8px;letter-spacing:-3px;background:linear-gradient(#fff4a8,var(--gold) 55%,#ff8b25);-webkit-background-clip:text;color:transparent;text-transform:uppercase}.brand p{margin:0;color:var(--muted);font-weight:800;letter-spacing:1.3px;text-transform:uppercase;font-size:11px}@keyframes float{50%{transform:translateY(-6px)}}.card{background:linear-gradient(145deg,#1d2745fa,#11172afa);border:1px solid var(--line);border-radius:23px;padding:19px;box-shadow:var(--shadow);margin-bottom:13px}.card h2{margin:0 0 14px;font-size:21px}label{display:block;color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin:12px 0 7px}.input{width:100%;height:52px;border:1px solid var(--line);border-radius:15px;background:#0d1325;color:#fff;padding:0 15px;outline:none;font-size:17px;font-weight:750}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #55b8ff22}.code-input{text-transform:uppercase;letter-spacing:5px;text-align:center;font-size:23px}.btn{width:100%;min-height:52px;border:0;border-radius:16px;padding:12px 16px;font-weight:950;cursor:pointer;transition:.12s}.btn:active{transform:scale(.975)}.btn:disabled{opacity:.42;cursor:not-allowed}.primary{background:linear-gradient(135deg,var(--gold),var(--orange));color:#251300;box-shadow:0 10px 24px #ff9a2c30}.secondary{background:var(--panel2);color:#fff;border:1px solid #3c4974}.danger{background:#3a1c2a;color:#ffafbb;border:1px solid #6f2d43}.divider{display:flex;align-items:center;gap:10px;color:#737c9c;font-size:11px;font-weight:900;margin:16px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.topbar{display:flex;align-items:center;justify-content:space-between;margin:7px 0 13px}.room-badge{background:#0d1325;border:1px solid var(--line);border-radius:15px;padding:8px 12px}.room-badge small{display:block;color:var(--muted);font-size:9px;font-weight:900}.room-badge strong{letter-spacing:3px;color:var(--gold);font-size:18px}.status{font-size:11px;color:var(--green);font-weight:900}.status.offline{color:var(--red)}.players{display:grid;gap:8px}.player{display:flex;align-items:center;gap:11px;padding:10px 11px;border:1px solid var(--line);border-radius:15px;background:#10172b}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:950;color:#111;flex:none}.player-info{min-width:0;flex:1}.player-name{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-tag{font-size:10px;color:var(--muted)}.ready{font-size:10px;font-weight:950;color:var(--green)}.game-head{text-align:center}.timer{font-size:54px;font-weight:950;line-height:1;margin:4px 0;color:var(--gold);font-variant-numeric:tabular-nums}.timer.urgent{color:var(--red);animation:pulse .5s infinite alternate}@keyframes pulse{to{transform:scale(1.05)}}.scoreline{color:var(--muted);font-weight:750}.scoreline b{color:#fff;font-size:25px}.race-btn{position:relative;width:min(78vw,330px);aspect-ratio:1;border-radius:50%;border:10px solid #3a2512;margin:18px auto;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#fff5a7 0 4%,var(--gold) 13%,#ff8424 62%,#d63a19 100%);box-shadow:0 18px 0 #7e240f,0 27px 48px #ff7b2244,inset 0 0 0 7px #ffea8355;color:#321600;font-size:36px;font-weight:1000;text-transform:uppercase;user-select:none;touch-action:manipulation;cursor:pointer}.race-btn:active:not(:disabled){transform:translateY(9px);box-shadow:0 9px 0 #7e240f,0 18px 32px #ff7b2233}.race-btn:disabled{filter:grayscale(.55);opacity:.65}.race-btn small{display:block;font-size:11px;letter-spacing:1px}.click-pop{position:absolute;font-weight:950;color:#fff;pointer-events:none;animation:pop .55s forwards}@keyframes pop{to{transform:translateY(-70px) scale(1.5);opacity:0}}.leaderboard{display:grid;gap:8px;counter-reset:rank}.leader{counter-increment:rank;display:grid;grid-template-columns:31px 1fr auto;align-items:center;gap:9px;padding:10px 11px;border-radius:14px;background:#10172b;border:1px solid var(--line)}.leader:before{content:counter(rank);height:27px;width:27px;border-radius:50%;display:grid;place-items:center;background:#27314e;color:var(--muted);font-weight:900}.leader:first-child{border-color:#b78a20;background:linear-gradient(90deg,#3b2d16,#151b2f)}.leader:first-child:before{background:var(--gold);color:#211500}.leader.me{box-shadow:inset 3px 0 var(--blue)}.leader-score{font-weight:950;color:var(--gold)}.countdown{position:fixed;inset:0;z-index:20;background:#080b16dd;backdrop-filter:blur(8px);display:grid;place-items:center;text-align:center}.countdown strong{font-size:min(40vw,180px);color:var(--gold);text-shadow:0 0 45px #ffaa33;animation:count .7s ease-out}@keyframes count{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}.winner{text-align:center}.winner .trophy{font-size:70px}.winner h2{font-size:30px;color:var(--gold);margin:5px}.notice{font-size:12px;line-height:1.5;color:var(--muted);text-align:center;margin-top:12px}.toast{position:fixed;left:50%;bottom:22px;z-index:50;transform:translateX(-50%) translateY(120px);background:#f6f7ff;color:#151927;padding:12px 17px;border-radius:13px;font-weight:850;box-shadow:var(--shadow);transition:.25s;max-width:calc(100% - 32px);text-align:center}.toast.show{transform:translateX(-50%) translateY(0)}@media(max-width:370px){.app{padding-inline:10px}.card{padding:16px}.race-btn{font-size:29px}}
</style>
</head>
<body>
<main class="app">
<header class="brand"><div class="crown">👑</div><h1>Race King</h1><p>Fastest fingers rule the kingdom</p></header>
<section id="homeScreen">
 <div class="card"><h2>Enter the arena</h2><label for="nameInput">Player name</label><input id="nameInput" class="input" maxlength="18" placeholder="Your nickname"><button id="createBtn" class="btn primary" style="margin-top:15px">Create Room</button><div class="divider">OR JOIN A RACE</div><label for="codeInput">Room code</label><input id="codeInput" class="input code-input" maxlength="6" placeholder="ABC123"><button id="joinBtn" class="btn secondary" style="margin-top:12px">Join Room</button></div>
 <p class="notice">Powered by Google Apps Script and Google Sheets</p>
</section>
<section id="lobbyScreen" class="hidden"><div class="topbar"><div class="room-badge"><small>ROOM CODE</small><strong id="roomCode">------</strong></div><div id="connectionStatus" class="status">● SYNCING</div></div><div class="card"><h2>Players <span id="playerCount" style="color:var(--gold)">0</span></h2><div id="playersList" class="players"></div></div><div class="card"><div id="hostControls" class="hidden"><label for="durationSelect">Race duration</label><select id="durationSelect" class="input"><option value="10">10 seconds</option><option value="15" selected>15 seconds</option><option value="20">20 seconds</option><option value="30">30 seconds</option></select><button id="startBtn" class="btn primary" style="margin-top:12px">Start Race</button></div><p id="waitingText" class="notice">Waiting for the host to start…</p><button id="leaveBtn" class="btn danger" style="margin-top:10px">Leave Room</button></div></section>
<section id="gameScreen" class="hidden"><div class="game-head"><div class="timer" id="timer">15.0</div><div class="scoreline">Your score: <b id="myScore">0</b></div></div><button id="raceBtn" class="race-btn" disabled><span>TAP!<small>as fast as you can</small></span></button><div class="card"><h2>Live leaderboard</h2><div id="liveLeaderboard" class="leaderboard"></div></div></section>
<section id="resultScreen" class="hidden"><div class="card winner"><div class="trophy">🏆</div><h2 id="winnerName">Race complete!</h2><p id="winnerScore" class="scoreline"></p></div><div class="card"><h2>Final leaderboard</h2><div id="finalLeaderboard" class="leaderboard"></div></div><button id="rematchBtn" class="btn primary hidden">Rematch</button><button id="resultLeaveBtn" class="btn secondary" style="margin-top:10px">Leave Room</button></section>
</main><div id="countdown" class="countdown hidden"><strong id="countdownText">3</strong></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* Paste the Google Apps Script /exec deployment URL below. */
const API_URL = 'https://script.google.com/macros/s/AKfycbxGlJoEDTFwC2j73qYoZdJKgb6x-VdtTxoZgRB6LzkMK_UXcgQK9Cur1Gki2jBRriYJ/exec';
const $=id=>document.getElementById(id),screens=['homeScreen','lobbyScreen','gameScreen','resultScreen'];
const colors=['#ffcc33','#55b8ff','#49df8a','#ff719d','#a78bfa','#ff8a2a','#58e0d1','#f478ff'];
let roomCode='',playerId='',token='',isHost=false,room=null,current='homeScreen',poller=null,clock=null,scoreSender=null,score=0,gameActive=false,lastStatus='';
$('nameInput').value=localStorage.getItem('raceKingName')||'';
function configured(){return API_URL.startsWith('https://script.google.com/macros/s/')&&API_URL.endsWith('/exec')}
function show(id){screens.forEach(x=>$(x).classList.toggle('hidden',x!==id));current=id}
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2600)}
function cleanName(){let n=$('nameInput').value.trim().replace(/[<>]/g,'').slice(0,18);if(!n)throw Error('Enter your player name first.');localStorage.setItem('raceKingName',n);return n}
function makeId(){return 'p_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9)}
async function api(action,data={}){if(!configured())throw Error('Paste your Apps Script /exec URL into API_URL.');const body=new URLSearchParams({action,...data}).toString();const r=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body});const j=await r.json();if(!j.ok)throw Error(j.error||'Server request failed.');return j}
function busy(id,on,text,normal){$(id).disabled=on;$(id).textContent=on?text:normal}
async function createRoom(){try{const name=cleanName();busy('createBtn',true,'Creating…','Create Room');playerId=makeId();let x=await api('createRoom',{playerId,name});roomCode=x.roomCode;token=x.token;enterRoom()}catch(e){toast(e.message)}finally{busy('createBtn',false,'Creating…','Create Room')}}
async function joinRoom(){try{const name=cleanName();roomCode=$('codeInput').value.trim().toUpperCase();if(roomCode.length!==6)throw Error('Enter a valid 6-character room code.');busy('joinBtn',true,'Joining…','Join Room');playerId=makeId();let x=await api('joinRoom',{roomCode,playerId,name});token=x.token;enterRoom()}catch(e){toast(e.message)}finally{busy('joinBtn',false,'Joining…','Join Room')}}
function enterRoom(){$('roomCode').textContent=roomCode;show('lobbyScreen');startPolling()}
function startPolling(){clearInterval(poller);syncRoom();poller=setInterval(syncRoom,700)}
async function syncRoom(){try{let x=await api('getRoom',{roomCode,playerId,token});room=x.room;isHost=room.hostId===playerId;$('connectionStatus').textContent='● LIVE';$('connectionStatus').classList.remove('offline');render();handleState()}catch(e){$('connectionStatus').textContent='● RETRYING';$('connectionStatus').classList.add('offline')}}
function render(){const p=room.players||[];$('playerCount').textContent=p.length;$('playersList').innerHTML=p.map((v,i)=>`<div class="player"><div class="avatar" style="background:${colors[i%colors.length]}">${esc((v.name||'?')[0].toUpperCase())}</div><div class="player-info"><div class="player-name">${esc(v.name)}${v.playerId===playerId?' (You)':''}</div><div class="player-tag">${v.playerId===room.hostId?'Room host':'Racer'}</div></div><span class="ready">READY</span></div>`).join('');$('hostControls').classList.toggle('hidden',!isHost);$('waitingText').classList.toggle('hidden',isHost);renderBoard('liveLeaderboard')}
function handleState(){if(room.status===lastStatus)return;lastStatus=room.status;if(room.status==='lobby'){stopGame();show('lobbyScreen');score=0}else if(room.status==='countdown')beginCountdown();else if(room.status==='playing')startGame();else if(room.status==='finished')showResults()}
async function startRace(){try{if((room.players||[]).length<2)throw Error('At least 2 players are needed.');busy('startBtn',true,'Starting…','Start Race');await api('startRace',{roomCode,playerId,token,duration:$('durationSelect').value})}catch(e){toast(e.message)}finally{busy('startBtn',false,'Starting…','Start Race')}}
function beginCountdown(){show('gameScreen');$('raceBtn').disabled=true;$('countdown').classList.remove('hidden');let n=Math.max(1,Math.ceil((room.startTime-Date.now())/1000));$('countdownText').textContent=n;const iv=setInterval(()=>{n=Math.max(0,Math.ceil((room.startTime-Date.now())/1000));$('countdownText').textContent=n||'GO!';if(!n){clearInterval(iv);setTimeout(()=>$('countdown').classList.add('hidden'),350)}},200)}
function startGame(){show('gameScreen');$('countdown').classList.add('hidden');gameActive=true;$('raceBtn').disabled=false;score=Number((room.players||[]).find(p=>p.playerId===playerId)?.score||0);$('myScore').textContent=score;clearInterval(clock);clearInterval(scoreSender);clock=setInterval(updateClock,50);scoreSender=setInterval(sendScore,450);updateClock()}
function updateClock(){if(!room)return;let left=Math.max(0,Number(room.endTime)-Date.now());$('timer').textContent=(left/1000).toFixed(1);$('timer').classList.toggle('urgent',left<=3000);if(left<=0){gameActive=false;$('raceBtn').disabled=true;sendScore();clearInterval(clock);clearInterval(scoreSender);if(isHost)api('finishRace',{roomCode,playerId,token}).catch(()=>{})}}
function tap(e){if(!gameActive)return;score++;$('myScore').textContent=score;let pop=document.createElement('span');pop.className='click-pop';pop.textContent='+1';const r=$('raceBtn').getBoundingClientRect();pop.style.left=((e.clientX||r.left+r.width/2)-r.left-8)+'px';pop.style.top=((e.clientY||r.top+r.height/2)-r.top-10)+'px';$('raceBtn').appendChild(pop);setTimeout(()=>pop.remove(),600)}
function sendScore(){if(roomCode&&playerId)api('updateScore',{roomCode,playerId,token,score:String(score)}).catch(()=>{})}
function sorted(){return [...(room?.players||[])].sort((a,b)=>b.score-a.score||a.joinedAt-b.joinedAt)}
function renderBoard(id){if(!$(id)||!room)return;$(id).innerHTML=sorted().map(p=>`<div class="leader ${p.playerId===playerId?'me':''}"><div class="player-name">${esc(p.name)}${p.playerId===playerId?' (You)':''}</div><div class="leader-score">${p.score||0}</div></div>`).join('')}
function showResults(){stopGame();show('resultScreen');const top=sorted()[0];$('winnerName').textContent=top?top.name+' is the Race King!':'Race complete!';$('winnerScore').innerHTML=top?`Winning score: <b>${top.score||0}</b> taps`:'';renderBoard('finalLeaderboard');$('rematchBtn').classList.toggle('hidden',!isHost)}
function stopGame(){gameActive=false;clearInterval(clock);clearInterval(scoreSender);$('raceBtn').disabled=true}
async function rematch(){try{await api('rematch',{roomCode,playerId,token})}catch(e){toast(e.message)}}
async function leave(){try{await sendScore();await api('leaveRoom',{roomCode,playerId,token})}catch(e){}clearInterval(poller);stopGame();room=null;roomCode='';playerId='';token='';lastStatus='';show('homeScreen')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('createBtn').onclick=createRoom;$('joinBtn').onclick=joinRoom;$('startBtn').onclick=startRace;$('raceBtn').addEventListener('pointerdown',tap);$('leaveBtn').onclick=leave;$('resultLeaveBtn').onclick=leave;$('rematchBtn').onclick=rematch;$('codeInput').oninput=e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&roomCode)syncRoom()});
</script></body></html>
